name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies & Sync Capacitor
      run: |
        npm install
        npx cap sync android

    - name: Build Debug APK with Gradle
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK File
      run: |
        mkdir -p output
        cp android/app/build/outputs/apk/debug/app-debug.apk output/pocketsmart-release.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pocketsmart-apk
        path: output/pocketsmart-release.apk

    - name: Create GitHub Release and Upload
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: output/pocketsmart-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}