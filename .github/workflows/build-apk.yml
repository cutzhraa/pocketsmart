name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # --- GENERATE & GANTI IKON ALA IOS OTOMATIS ---
    # Langkah ini hanya dijalankan saat membuat Git Tag (misal v1.0.0)
    - name: Apply iOS-style Icon (Release Only)
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        echo "Downloading iOS-style icon asset..."
        curl -L -o ios_icon.png https://raw.githubusercontent.com/cutzhraa/pocketsmart/main/assets/icon_ios_style.png || echo "Warning: Default icon asset download failed. Using local fallback if exists."

        if [ -f ios_icon.png ]; then
          echo "Replacing Android app icons with iOS-style..."
          find android/app/src/main/res -name "ic_launcher.png" -exec cp ios_icon.png {} \; || echo "Warning: Icon replacement failed for drawable folder."
          find android/app/src/main/res -name "ic_launcher_round.png" -exec cp ios_icon.png {} \; || echo "Warning: Icon replacement failed for round folder."
          echo "Icon replaced successfully."
        else
          echo "Error: iOS icon asset missing. Build will use Capacitor default icon."
        fi

    - name: Inject App Version
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "Injecting version: $VERSION"
        sed -i "s|__APP_VERSION__|$VERSION|g" www/index.html

    - name: Build APK with Gradle
      working-directory: ./android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK File
      run: |
        mkdir -p output
        cp android/app/build/outputs/apk/debug/app-debug.apk output/pocketsmart-release.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pocketsmart-apk
        path: output/pocketsmart-release.apk

    - name: Create GitHub Release and Upload
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: output/pocketsmart-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
